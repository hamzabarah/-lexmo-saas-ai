<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عُمق — جلسة التركيز</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F0EEE6;font-family:'Almarai','Tajawal',sans-serif;color:#1A1915;display:grid;place-items:center;min-height:100vh;padding:32px}
.screen{width:1180px;max-width:100%;background:#FAF9F5;border:1px solid #E8E6DF;border-radius:14px;box-shadow:0 6px 24px rgba(90,80,60,.1);overflow:hidden}
b{font-weight:700}
.s3c-h1:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3c-h2:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3c-h3:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3c-h4:hover{background:#C56A4C !important}
.s3c-h5:hover{background:#F0EEE6 !important;color:#1A1915 !important}
</style>
</head>
<body>
<div class="screen">
<div style="display:flex;min-height:800px;background:#FAF9F5;color:#1A1915">
  <aside style="width:232px;flex:none;border-left:1px solid #E8E6DF;padding:24px 16px;display:flex;flex-direction:column;gap:2px;background:#F0EEE6">
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:24px">
      <div style="width:32px;height:32px;border-radius:9px;background:#D97757;display:grid;place-items:center;font-weight:800;font-size:15px;color:#FAF9F5;box-shadow:0 2px 6px rgba(217,119,87,.25)">ع</div>
      <div style="font-weight:800;font-size:16px;letter-spacing:-.2px">عُمق</div>
    </div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3c-h1"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>البيانات</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3c-h2"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>لوحة كانبان</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;background:#FFFFFF;border:1px solid #E8E6DF;box-shadow:0 2px 8px rgba(26,25,21,.04);color:#D97757;font-size:14px;font-weight:700"><span style="width:8px;height:8px;border-radius:50%;background:#D97757;flex:none"></span>جلسات التركيز</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3c-h3"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>التقارير</div>
  </aside>
  <main style="flex:1;padding:40px 48px;min-width:0;display:flex;flex-direction:column;align-items:center">
    <div style="align-self:stretch;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
      <h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.4px">جلسة عمل عميق</h1>
      <div style="font-size:13px;color:#6B6A64">الأحد 30 أغسطس 2026</div>
    </div>
    <div style="align-self:stretch;font-size:14px;color:#6B6A64;margin-bottom:48px">المهمة الحالية: <b style="color:#1A1915;font-weight:700">التحقق من Stripe</b> · <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B;display:inline-block"></span>ECOMY</span></div>
    <div style="width:360px;height:360px;border-radius:50%;background:conic-gradient(#D97757 0 62%,#EEE9DF 62% 100%);display:grid;place-items:center;margin-bottom:48px">
      <div style="width:340px;height:340px;border-radius:50%;background:#FAF9F5;display:grid;place-items:center">
        <div style="width:308px;height:308px;border-radius:50%;background:#FFFFFF;border:1px solid #F0EEE6;box-shadow:0 2px 8px rgba(26,25,21,.04);display:grid;place-items:center">
          <div style="text-align:center">
            <div style="font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-2.5px" dir="ltr">15:32</div>
            <div style="font-size:13px;color:#6B6A64;margin-top:14px">من أصل <span dir="ltr">25</span> دقيقة · الجلسة <span dir="ltr">3</span></div>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:56px">
      <span style="padding:13px 40px;border-radius:12px;background:#D97757;color:#FAF9F5;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(217,119,87,.28);cursor:pointer" class="s3c-h4">إيقاف مؤقت</span>
      <span style="padding:13px 24px;border-radius:12px;border:1px solid #E8E6DF;background:#FFFFFF;font-size:15px;color:#6B6A64;cursor:pointer" class="s3c-h5">إنهاء الجلسة</span>
    </div>
    <div style="align-self:stretch;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:auto">
      <div style="border:1px solid #E8E6DF;border-radius:16px;padding:20px 24px;background:#FFFFFF;box-shadow:0 2px 8px rgba(26,25,21,.04);display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;color:#6B6A64">جلسات اليوم</span><span style="font-size:26px;font-weight:800;color:#D97757;letter-spacing:-.5px" dir="ltr">3</span></div>
      <div style="border:1px solid #E8E6DF;border-radius:16px;padding:20px 24px;background:#FFFFFF;box-shadow:0 2px 8px rgba(26,25,21,.04);display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;color:#6B6A64">دقائق العمل اليوم</span><span style="font-size:26px;font-weight:800;letter-spacing:-.5px" dir="ltr">145</span></div>
      <div style="border:1px solid #E8E6DF;border-radius:16px;padding:20px 24px;background:#FFFFFF;box-shadow:0 2px 8px rgba(26,25,21,.04);display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;color:#6B6A64">سلسلة الأيام</span><span style="font-size:26px;font-weight:800;color:#8A9A5B;letter-spacing:-.5px" dir="ltr">7</span></div>
    </div>
  </main>
</div>
</div>
</body>
</html>
