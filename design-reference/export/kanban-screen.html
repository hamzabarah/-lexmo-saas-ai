<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عُمق — لوحة كانبان</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F0EEE6;font-family:'Almarai','Tajawal',sans-serif;color:#1A1915;display:grid;place-items:center;min-height:100vh;padding:32px}
.screen{width:1180px;max-width:100%;background:#FAF9F5;border:1px solid #E8E6DF;border-radius:14px;box-shadow:0 6px 24px rgba(90,80,60,.1);overflow:hidden}
b{font-weight:700}
.s3b-h1:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3b-h2:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3b-h3:hover{background:rgba(255,255,255,.75) !important;color:#1A1915 !important}
.s3b-h4:hover{box-shadow:0 6px 16px rgba(26,25,21,.08) !important;border-color:#DDD9CE !important}
.s3b-h5:hover{box-shadow:0 6px 16px rgba(26,25,21,.08) !important;border-color:#DDD9CE !important}
.s3b-h6:hover{box-shadow:0 6px 16px rgba(26,25,21,.08) !important;border-color:#DDD9CE !important}
.s3b-h7:hover{box-shadow:0 6px 16px rgba(26,25,21,.08) !important;border-color:#DDD9CE !important}

</style>
</head>
<body>
<div class="screen">
<div style="display:flex;min-height:800px;background:#FAF9F5;color:#1A1915">
  <aside style="width:232px;flex:none;border-left:1px solid #E8E6DF;padding:24px 16px;display:flex;flex-direction:column;gap:2px;background:#F0EEE6">

      <div style="width:32px;height:32px;border-radius:9px;background:#D97757;display:grid;place-items:center;font-weight:800;font-size:15px;color:#FAF9F5;box-shadow:0 2px 6px rgba(217,119,87,.25)">ع</div>
      <div style="font-weight:800;font-size:16px;letter-spacing:-.2px">عُمق</div>
    </div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3b-h1"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>البيانات</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;background:#FFFFFF;border:1px solid #E8E6DF;box-shadow:0 2px 8px rgba(26,25,21,.04);color:#D97757;font-size:14px;font-weight:700"><span style="width:8px;height:8px;border-radius:50%;background:#D97757;flex:none"></span>لوحة كانبان</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3b-h2"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>جلسات التركيز</div>
    <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#6B6A64;font-size:14px" class="s3b-h3"><span style="width:8px;height:8px;border-radius:50%;background:#CFCCC2;flex:none"></span>التقارير</div>
  </aside>
  <main style="flex:1;padding:32px 40px;min-width:0">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:32px">
      <h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.4px">لوحة كانبان</h1>
      <div style="font-size:13px;color:#6B6A64">كل المشاريع</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start">
      <div style="background:#F0EEE6;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:9px;padding:0 8px 4px"><span style="font-weight:800;font-size:16px">للتنفيذ</span><span style="font-size:12px;font-weight:700;color:#6B6A64;background:#FFFFFF;border:1px solid #E8E6DF;padding:1px 9px;border-radius:99px" dir="ltr">4</span></div>
        <div style="background:#FFFFFF;border:1px solid #E8E6DF;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(26,25,21,.04);cursor:grab" class="s3b-h4">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5">التحقق من Stripe</div>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#C0392B;background:#F9E9E6;padding:3px 10px;border-radius:99px;font-weight:700">عاجل</span><span style="margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B6A64"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B"></span>ECOMY</span></div>
        </div>
        <div style="background:#FFFFFF;border:1px solid #E8E6DF;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(26,25,21,.04);cursor:grab" class="s3b-h5">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5">تحديث تصميم المنصة</div>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#C0392B;background:#F9E9E6;padding:3px 10px;border-radius:99px;font-weight:700">عاجل</span><span style="margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B6A64"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B"></span>ECOMY</span></div>
        </div>
        <div style="background:#FFFFFF;border:1px solid #E8E6DF;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(26,25,21,.04);cursor:grab" class="s3b-h6">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5">حسابات التواصل الاجتماعي</div>
          <div style="display:flex;align-items:center;gap:8px"><span style="margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B6A64"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B"></span>ECOMY</span></div>
        </div>
        <div style="background:#FFFFFF;border:1px solid #E8E6DF;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(26,25,21,.04);cursor:grab" class="s3b-h7">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5">الخطة الاستراتيجية لمليون يورو 2034</div>
          <div style="display:flex;align-items:center;gap:8px"><span style="margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B6A64"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B"></span>ECOMY</span></div>
        </div>
      </div>
      <div style="background:#F0EEE6;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:9px;padding:0 8px 4px"><span style="font-weight:800;font-size:16px">قيد التنفيذ</span><span style="font-size:12px;font-weight:700;color:#6B6A64;background:#FFFFFF;border:1px solid #E8E6DF;padding:1px 9px;border-radius:99px" dir="ltr">1</span></div>
        <div style="background:#FFFFFF;border:1px solid #EBD9CF;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(26,25,21,.04);cursor:grab" class="s3b-h8">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;line-height:1.5">أداة إنشاء المحتوى</div>
          <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#B0713F;background:#F6EBDD;padding:3px 10px;border-radius:99px;font-weight:700">قيد التنفيذ</span><span style="margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6B6A64"><span style="width:6px;height:6px;border-radius:50%;background:#C0392B"></span>ECOMY</span></div>
        </div>
      </div>
      <div style="background:#F0EEE6;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:9px;padding:0 8px 4px"><span style="font-weight:800;font-size:16px">منجز</span><span style="font-size:12px;font-weight:700;color:#6B6A64;background:#FFFFFF;border:1px solid #E8E6DF;padding:1px 9px;border-radius:99px" dir="ltr">0</span></div>
        <div style="border:1px dashed #DDD9CE;border-radius:14px;padding:28px 16px;text-align:center;font-size:12.5px;color:#9B998F">اسحب مهمة هنا عند إنجازها</div>
      </div>
    </div>
  </main>
</div>
</div>
